<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" role="img" aria-label="Folivora System Architecture and Dual-Lane Dataflow">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="100%" stop-color="#F3EFE6"/>
    </linearGradient>
    <linearGradient id="mossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F5E43"/>
      <stop offset="100%" stop-color="#164631"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="ochreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B86B14"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14211B" flood-opacity="0.07"/>
    </filter>
    <marker id="arrowMoss" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F5E43"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0F766E"/>
    </marker>
    <marker id="arrowOchre" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B86B14"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="760" rx="24" fill="url(#bgGrad)" stroke="#DCD6C8" stroke-width="2"/>

  <!-- Top Header Banner -->
  <text x="600" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#14211B" letter-spacing="-0.3">
    FOLIVORA — DUAL-LANE PROGRESSIVE ARCHITECTURE &amp; VERIFICATION PIPELINE
  </text>
  <text x="600" y="64" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#4A5A52">
    Code owns the numbers · TabPFN predicts calibrated quantiles · Gemma &amp; Gemini write grounded prose · Sentry traces every span
  </text>

  <!-- ======================================================================
       STAGE 1: INGESTION & INTENT EXTRACTION (TOP ROW)
       ====================================================================== -->
  <!-- Left Box: Voice Intent -->
  <g filter="url(#cardShadow)">
    <rect x="48" y="88" width="528" height="122" rx="16" fill="#FFFFFF" stroke="#CFDAD3" stroke-width="1.5"/>
    <rect x="48" y="88" width="528" height="32" rx="16" fill="#F0F7F3"/>
    <rect x="48" y="104" width="528" height="16" fill="#F0F7F3"/>
    <text x="68" y="109" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#1B543B">STAGE 01A · ZERO-RETENTION VOICE INTENT (OPTIONAL)</text>
    <rect x="438" y="95" width="122" height="18" rx="9" fill="#DCECE4"/>
    <text x="499" y="108" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#164631">Immediate Wipe</text>

    <text x="68" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14211B">ElevenLabs Scribe v2 STT (src/audio_service.py)</text>
    <text x="68" y="164" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#4A5A52">• Transcribes spoken topic focus (e.g., "Japan Travel", "Web Development")</text>
    <text x="68" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#4A5A52">• Fires immediate remote DELETE /v1/speech-to-text/transcripts/{id} in finally</text>
    <text x="68" y="201" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#1F5E43">extract_focus_tokens() ➔ Semantic Ecosystem Synonym Expansion</text>
  </g>

  <!-- Right Box: Browserbase CDP & DOM Extraction -->
  <g filter="url(#cardShadow)">
    <rect x="624" y="88" width="528" height="122" rx="16" fill="#FFFFFF" stroke="#CFDAD3" stroke-width="1.5"/>
    <rect x="624" y="88" width="528" height="32" rx="16" fill="#F0F7F3"/>
    <rect x="624" y="104" width="528" height="16" fill="#F0F7F3"/>
    <text x="644" y="109" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#1B543B">STAGE 01B · CLOUD BROWSER &amp; DOM EXTRACTION</text>
    <rect x="1014" y="95" width="122" height="18" rx="9" fill="#DCECE4"/>
    <text x="1075" y="108" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#164631">SSRF Hardened</text>

    <text x="644" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14211B">Browserbase Cloud Chromium CDP (src/browserbase_service.py)</text>
    <text x="644" y="164" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#4A5A52">• Inspects live URLs over raw CDP WebSockets (&lt;=16 tabs) + REQUEST_RELEASE</text>
    <text x="644" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#4A5A52">• Extracts 7 DOM signals: word_count, code_blocks, tables, headings, links</text>
    <text x="644" y="201" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#1F5E43">Builds bounded E#/C# Evidence Packs (raw full_text stays server-only)</text>
  </g>

  <!-- Connector Arrows from Stage 1 to Stage 2 -->
  <path d="M 312 210 L 312 232 L 540 232 L 540 250" fill="none" stroke="#1F5E43" stroke-width="2.2" marker-end="url(#arrowMoss)"/>
  <path d="M 888 210 L 888 232 L 660 232 L 660 250" fill="none" stroke="#1F5E43" stroke-width="2.2" marker-end="url(#arrowMoss)"/>

  <!-- ======================================================================
       STAGE 2: FAST LANE (DETERMINISTIC, ZERO LLM) — TABPFN QUANTILE TRIAGE
       ====================================================================== -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="254" width="960" height="142" rx="18" fill="#FFFFFF" stroke="#1F5E43" stroke-width="2"/>
    <rect x="120" y="254" width="960" height="36" rx="18" fill="url(#mossGrad)"/>
    <rect x="120" y="274" width="960" height="16" fill="url(#mossGrad)"/>
    <text x="144" y="277" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">STAGE 02 · INSTANT FAST LANE (POST /triage — DETERMINISTIC, ZERO LLM)</text>
    <rect x="880" y="262" width="182" height="20" rx="10" fill="#FBF0DF"/>
    <text x="971" y="276" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#92400E">0.36% False-Close Rate</text>

    <!-- Inside Stage 2 Left -->
    <text x="144" y="314" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#14211B">Prior Labs TabPFN v2 Quantile Engine (src/tabpfn_engine.py)</text>
    <text x="144" y="335" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#4A5A52">• Predicts calibrated P10 / P50 / P90 utility quantiles across 7 features on CPU (77.9% empirical band coverage)</text>
    <text x="144" y="355" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#4A5A52">• Enforces asymmetric safety guardrail: a tab is only set aside when even its optimistic P90 upper bound &lt; 45.0</text>
    <text x="144" y="377" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#1B543B">Returns immediately: Sanitized Reading Cards (Topic Focus + Full Summary tabs) + Private TTL/LRU job_id</text>

    <!-- Verdict Pills on Right of Stage 2 -->
    <rect x="836" y="302" width="222" height="36" rx="10" fill="#F0F7F3" stroke="#A7F3D0" stroke-width="1.2"/>
    <text x="947" y="324" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#065F46">P90 &gt;= 45 ➔ WORTH YOUR TIME</text>
    <rect x="836" y="346" width="222" height="36" rx="10" fill="#F6F3EC" stroke="#D6D1C4" stroke-width="1.2"/>
    <text x="947" y="368" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#4A5A52">P90 &lt; 45  ➔ SET ASIDE</text>
  </g>

  <!-- Connector Arrows from Stage 2 to Stage 3A & 3B -->
  <path d="M 380 396 L 380 432" fill="none" stroke="#0F766E" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#arrowTeal)"/>
  <text x="392" y="420" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#0F766E">Async POST /digest</text>

  <path d="M 820 396 L 820 432" fill="none" stroke="#B86B14" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#arrowOchre)"/>
  <text x="832" y="420" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#B86B14">Async POST /polish-tabs</text>

  <!-- ======================================================================
       STAGE 3: PROGRESSIVE GROUNDED AI UPGRADE LANES (PARALLEL)
       ====================================================================== -->
  <!-- Left Box: 3A Executive Digest Lane -->
  <g filter="url(#cardShadow)">
    <rect x="48" y="438" width="528" height="148" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/>
    <rect x="48" y="438" width="528" height="34" rx="16" fill="url(#tealGrad)"/>
    <rect x="48" y="456" width="528" height="16" fill="url(#tealGrad)"/>
    <text x="68" y="460" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF">STAGE 03A · SPOKEN DIGEST LANE (src/gemma_service.py)</text>
    <rect x="434" y="445" width="126" height="19" rx="9.5" fill="#CCFBF1"/>
    <text x="497" y="458" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#115E59">59/60 Verified</text>

    <text x="68" y="494" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14211B">Open-Weight Google Gemma 4 (thinkingLevel: MINIMAL, ~2.5s)</text>
    <text x="68" y="516" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#4A5A52">• Synthesizes a 2-sentence spoken overview from Python's locked counts</text>
    <text x="68" y="536" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#4A5A52">• check_output() enforces exact digit allowlist, required facts &amp; 10–42 word cap</text>
    <text x="68" y="556" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#4A5A52">• 1 named-token retry on failure ➔ deterministic template fallback</text>
    <text x="68" y="574" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#0F766E">Providers: Google AI Studio Gemma 4 ➔ OpenRouter Gemma 3 ➔ Ollama</text>
  </g>

  <!-- Right Box: 3B Card Polish Lane -->
  <g filter="url(#cardShadow)">
    <rect x="624" y="438" width="528" height="148" rx="16" fill="#FFFFFF" stroke="#B86B14" stroke-width="1.8"/>
    <rect x="624" y="438" width="528" height="34" rx="16" fill="url(#ochreGrad)"/>
    <rect x="624" y="456" width="528" height="16" fill="url(#ochreGrad)"/>
    <text x="644" y="460" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF">STAGE 03B · GROUNDED CARD POLISH (src/summary_service.py)</text>
    <rect x="1024" y="445" width="112" height="19" rx="9.5" fill="#FEF3C7"/>
    <text x="1080" y="458" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#92400E">0.0% Red-Team ASR</text>

    <text x="644" y="494" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14211B">Gemini 3.1 Flash Lite + Multi-Lane Gemma Pool (3 concurrent)</text>
    <text x="644" y="516" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#4A5A52">• 1. _repair_draft_citations(): maps bullets to E#/C# &amp; 8-word exact anchors</text>
    <text x="644" y="536" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#4A5A52">• 2. validate_tab_summary() (v3): checks digits/units, &lt;90% copy, 0 emojis</text>
    <text x="644" y="556" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#4A5A52">• 3. _repair_bullets(): rewrites only offending bullets at temp=0.1</text>
    <text x="644" y="574" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#B86B14">Upgrades top 8 cards in place without losing active tab or focus</text>
  </g>

  <!-- Connector Arrows from Stage 3 to Stage 4 -->
  <path d="M 312 586 L 312 608 L 540 608 L 540 624" fill="none" stroke="#1F5E43" stroke-width="2.2" marker-end="url(#arrowMoss)"/>
  <path d="M 888 586 L 888 608 L 660 608 L 660 624" fill="none" stroke="#1F5E43" stroke-width="2.2" marker-end="url(#arrowMoss)"/>

  <!-- ======================================================================
       STAGE 4: ACTIONABLE PAYOFF & SENTRY OPENTELEMETRY OBSERVABILITY
       ====================================================================== -->
  <g filter="url(#cardShadow)">
    <rect x="88" y="628" width="1024" height="104" rx="16" fill="#14211B" stroke="#2C825D" stroke-width="1.5"/>
    <text x="116" y="655" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#6EE7B7">STAGE 04 · ACTIONABLE READING PAYOFF &amp; FORENSIC GENAI OBSERVABILITY</text>

    <!-- 3 Pillars in Footer Box -->
    <rect x="116" y="668" width="308" height="48" rx="10" fill="#1E2F27" stroke="#2D473B" stroke-width="1"/>
    <text x="132" y="688" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🎙️ ElevenLabs Flash v2.5 TTS</text>
    <text x="132" y="706" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#A7F3D0">15-sec spoken digest in Charlie's voice</text>

    <rect x="446" y="668" width="308" height="48" rx="10" fill="#1E2F27" stroke="#2D473B" stroke-width="1"/>
    <text x="462" y="688" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">📑 Export, Print &amp; 1-Click Hibernate</text>
    <text x="462" y="706" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#A7F3D0">Markdown notes, Bookmarks &amp; 0-RAM sleep</text>

    <rect x="776" y="668" width="310" height="48" rx="10" fill="#1E2F27" stroke="#2D473B" stroke-width="1"/>
    <text x="792" y="688" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🔭 Sentry OpenTelemetry Spans</text>
    <text x="792" y="706" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#A7F3D0">gen_ai.request + (?&lt;!put_)token(?!s) scrubber</text>
  </g>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Folivora</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 370px;
      font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
      background: #FBF9F5;
      color: #14211B;
      padding: 18px;
    }
    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .brand { font-size: 16px; font-weight: 800; color: #14211B; letter-spacing: -0.02em; }
    .badge { font-size: 11px; background: #F0F7F3; color: #1B543B; border: 1px solid #DCECE4; padding: 3px 9px; border-radius: 99px; font-weight: 700; }
    .desc { font-size: 12px; color: #4A5A52; line-height: 1.5; margin-bottom: 12px; }
    .field-label { font-size: 11px; font-weight: 700; color: #24332C; margin-bottom: 5px; display: block; }
    .server-input {
      width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid rgba(20, 33, 27, 0.16);
      background: #FFFFFF; color: #14211B; font-size: 12px; margin-bottom: 10px;
    }
    .server-input:focus { outline: 2px solid rgba(31, 94, 67, 0.45); border-color: #1F5E43; }
    .btn {
      width: 100%; padding: 10px 13px; border-radius: 10px; border: none;
      font-weight: 700; font-size: 12.5px; cursor: pointer; margin-bottom: 7px;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .btn-primary { background: #1F5E43; color: #FFFFFF; }
    .btn-primary:hover { background: #1B543B; }
    .btn-secondary { background: #FFFFFF; color: #14211B; border: 1px solid rgba(20, 33, 27, 0.16); }
    .btn-secondary:hover { border-color: #1F5E43; color: #1B543B; }
    .btn-warn { background: #FFF1F2; color: #BE123C; border: 1px solid #FECDD3; }
    .btn-warn:hover { background: #FFE4E6; }
    .btn-undo { background: #F0F7F3; color: #1B543B; border: 1px solid #DCECE4; }
    .status {
      font-size: 12px; color: #24332C; margin-top: 8px; line-height: 1.5;
      background: #FFFFFF; border: 1px solid rgba(20, 33, 27, 0.12); border-radius: 10px; padding: 11px;
    }
    .digest-line { font-weight: 700; margin-bottom: 6px; }
    .stat-line { font-size: 11.5px; color: #1B543B; font-weight: 700; margin-bottom: 6px; }
    .mini-line { font-size: 11.5px; color: #4A5A52; margin-bottom: 3px; }
    .mini-note { font-size: 10.5px; color: #6B7A71; margin-top: 6px; }
    .cleanup-actions { margin-top: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="head">
    <span class="brand">Folivora</span>
    <span class="badge" id="tab-count-badge">Scanning…</span>
  </div>
  <p class="desc">Summarize all open tabs in this window, filter by what you need right now, and put unused tabs to sleep in one click.</p>

  <label class="field-label" for="intent-input">Looking for something specific? (Optional)</label>
  <input id="intent-input" class="server-input" type="text" placeholder="e.g. Japan trip, sleep, laptops, Web Dev (or leave blank)">

  <label class="field-label" for="server-url">Folivora Server URL</label>
  <input id="server-url" class="server-input" type="text" value="http://localhost:8000" title="Folivora Server URL">

  <button id="btn-open-dashboard" class="btn btn-primary">
    Open Full Reading Digest
  </button>

  <button id="btn-quick-summary" class="btn btn-secondary">
    Quick Summary &amp; Tab Cleanup
  </button>

  <div id="cleanup-box" class="cleanup-actions hidden">
    <button id="btn-hibernate-closed" class="btn btn-secondary">
      Put Unrelated Tabs to Sleep (Save Memory)
    </button>
    <button id="btn-close-unrelated" class="btn btn-warn">
      Close Unrelated Tabs (With Undo)
    </button>
  </div>

  <button id="btn-undo-close" class="btn btn-undo hidden">
    Restore Last Closed Tabs
  </button>

  <div id="result-box" class="status hidden"></div>

  <script src="popup.js"></script>
</body>
</html>

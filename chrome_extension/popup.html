<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Folivora</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 370px;
      font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
      background: #FBF9F5;
      color: #14211B;
      padding: 18px;
    }
    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .brand { font-size: 16px; font-weight: 800; color: #14211B; letter-spacing: -0.02em; }
    .badge { font-size: 11px; background: #F0F7F3; color: #1B543B; border: 1px solid #DCECE4; padding: 3px 9px; border-radius: 99px; font-weight: 700; }
    .desc { font-size: 12px; color: #4A5A52; line-height: 1.5; margin-bottom: 12px; }
    .field-label { font-size: 11px; font-weight: 700; color: #24332C; margin-bottom: 5px; display: block; }
    .server-input {
      width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid rgba(20, 33, 27, 0.16);
      background: #FFFFFF; color: #14211B; font-size: 12px; margin-bottom: 10px;
    }
    .server-input:focus { outline: 2px solid rgba(31, 94, 67, 0.45); border-color: #1F5E43; }
    .btn {
      width: 100%; padding: 11px 13px; border-radius: 10px; border: none;
      font-weight: 700; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .btn-primary { background: #1F5E43; color: #FFFFFF; }
    .btn-primary:hover { background: #1B543B; }
    .hint { font-size: 10.5px; color: #6B7A71; margin-top: 9px; text-align: center; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="head">
    <span class="brand">Folivora</span>
    <span class="badge" id="tab-count-badge">Scanning…</span>
  </div>
  <p class="desc">Send every open tab in this window to your Folivora Reading Digest — the full triage, section-anchored takeaways, spoken brief, print and exports.</p>

  <label class="field-label" for="intent-input">Looking for something specific? (Optional)</label>
  <input id="intent-input" class="server-input" type="text" placeholder="e.g. Japan trip, sleep, laptops, Web Dev (or leave blank)">

  <label class="field-label" for="server-url">Folivora Server URL</label>
  <input id="server-url" class="server-input" type="text" value="http://localhost:8000" title="Folivora Server URL">

  <button id="btn-open-dashboard" class="btn btn-primary">
    Open Full Reading Digest
  </button>

  <p class="hint">Your tabs open as a pre-filled digest on the server —<br>nothing is closed or changed in this window.</p>

  <script src="popup.js"></script>
</body>
</html>
